# Alembic 설정 파일
# Railway 배포 시 시작 명령에서 자동 실행:
#   alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

[alembic]
# 마이그레이션 스크립트 위치
script_location = alembic

# 파일 이름 포맷 (YYYY-MM-DD_HH-MM-SS_slug.py)
file_template = %%(rev)s_%%(slug)s

# 타임존
timezone = Asia/Seoul

# DB URL — env.py 에서 config.py 를 읽어 자동 설정됨
# 여기에 직접 넣지 마세요 (비밀값 노출 위험)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
